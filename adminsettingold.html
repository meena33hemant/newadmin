<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Setting</title>


<style>

/* =====================================================
   1. PAGE BASIC DESIGN
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#9d9d9d;
    color:#ffffff;
    min-height:100vh;
}

.container{
    max-width:750px;
    margin:auto;
    padding-bottom:30px;
}


/* =====================================================
   2. TOP HEADING
===================================================== */

.top-heading{
    background:#000000;
    color:#ffffff;
    text-align:center;
    padding:20px;
    font-size:28px;
    font-weight:bold;
    position:sticky;
    top:0;
    z-index:100;
}


/* =====================================================
   3. MAIN CONTENT
===================================================== */

.content{
    padding:18px;
}

.popup-button{
    width:100%;
    border:none;
    border-radius:40px;
    background:#ffc107;
    color:#6a1b9a;
    padding:18px;
    font-size:24px;
    cursor:pointer;
    margin-bottom:30px;
}


/* =====================================================
   4. FORM LABEL + INPUT
===================================================== */

.form-group{
    margin-bottom:24px;
}

.form-group label{
    display:block;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
    margin-left:8px;
}

.form-group input,
.form-group textarea,
.form-group select{

    width:100%;

    min-height:82px;

    border:none;

    border-radius:16px;

    background:#ffffff;

    color:#111111;

    padding:15px 18px;

    font-size:21px;

    outline:none;

    box-shadow:0 5px 12px rgba(0,0,0,0.20);

}

.center-text{
    text-align:center;
}


/* =====================================================
   5. TWO COLUMN BOX
===================================================== */

.two-column{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}


/* =====================================================
   6. PAYMENT GATEWAY BUTTON
===================================================== */

.section-title{
    text-align:center;
    font-size:20px;
    font-weight:bold;
    margin-bottom:16px;
}

.gateway-row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

    margin-bottom:26px;

}

.gateway-btn{

    min-height:70px;

    border:none;

    border-radius:14px;

    color:#ffffff;

    font-size:19px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 12px rgba(0,0,0,0.20);

}

.green{
    background:#09b30d;
}

.red{
    background:#ff1111;
}

.gray{
    background:#b5b5b5;
}


/* =====================================================
   7. ON / OFF BUTTON
===================================================== */

.status-box{
    text-align:center;
}

.status-box label{
    display:block;
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
}

.status-btn{

    min-width:115px;

    min-height:68px;

    border:none;

    border-radius:14px;

    background:#ffffff;

    color:#d71919;

    font-size:20px;

    cursor:pointer;

    box-shadow:0 5px 12px rgba(0,0,0,0.20);

}

.status-btn.on{
    color:#0b9b20;
}


/* =====================================================
   8. CLICKABLE SETTING BOX
===================================================== */

.setting-box{

    width:100%;

    min-height:82px;

    background:#ffffff;

    color:#111111;

    border-radius:16px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:15px 20px;

    font-size:21px;

    cursor:pointer;

    box-shadow:0 5px 12px rgba(0,0,0,0.20);

}

.arrow{
    color:#3f51b5;
    font-size:38px;
}


/* =====================================================
   9. BANNER BUTTONS
===================================================== */

.banner-row{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:12px;

}

.banner-button{

    min-height:75px;

    background:#ffffff;

    color:#111111;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-shadow:0 5px 12px rgba(0,0,0,0.20);

}


/* =====================================================
   10. SAVE + BACK BUTTON
===================================================== */

.bottom-buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:20px;

}

.save-btn,
.back-btn{

    min-height:58px;

    border:none;

    border-radius:12px;

    font-size:17px;

    font-weight:bold;

    color:#ffffff;

    cursor:pointer;

}

.save-btn{
    background:#00bd0a;
}

.back-btn{
    background:#2e6288;
}


/* =====================================================
   11. POPUP PANEL
===================================================== */

.full-panel{

    display:none;

    position:fixed;

    inset:0;

    z-index:500;

    overflow:auto;

    background:#ffffff;

    color:#222222;

}

.full-panel.show{
    display:block;
}

.panel-inner{

    max-width:750px;

    margin:auto;

    padding:30px 25px;

}

.panel-title{

    font-size:40px;

    margin-bottom:30px;

}

.update-btn{

    border:none;

    background:#0d86f7;

    color:#ffffff;

    min-height:58px;

    padding:0 26px;

    border-radius:6px;

    font-size:20px;

    cursor:pointer;

}


/* =====================================================
   12. TIME PANEL
===================================================== */

.time-panel{
    background:#000000;
    color:#ffffff;
}

.day-row{

    display:flex;

    gap:12px;

    overflow-x:auto;

    margin-bottom:55px;

}

.day-btn{

    min-width:165px;

    min-height:90px;

    border:none;

    border-radius:6px;

    background:#d1d1d1;

    color:#222222;

    font-size:22px;

    cursor:pointer;

}

.day-btn.active{
    background:#ffc107;
}

.time-panel input{

    min-height:110px;

    text-align:center;

    font-size:26px;

}

.big-update{

    width:100%;

    min-height:88px;

    background:#ffc107;

    color:#222222;

    border:none;

    font-size:22px;

    font-weight:bold;

    margin-top:70px;

    cursor:pointer;

}


/* =====================================================
   13. MOBILE
===================================================== */

@media(max-width:600px){

    .top-heading{
        font-size:22px;
    }

    .content{
        padding:15px;
    }

    .popup-button{
        font-size:20px;
    }

    .form-group label{
        font-size:16px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select,
    .setting-box{
        font-size:18px;
        min-height:76px;
    }

    .two-column,
    .gateway-row{
        gap:12px;
    }

}


/* =====================================================
   END CSS
===================================================== */

</style>

</head>

<!-- =====================================================

<script>

/* =====================================================
   1. SHORT FUNCTIONS
===================================================== */

function getSettings(){

    try{

        return JSON.parse(
            localStorage.getItem("adminSettings")
        ) || {};

    }
    catch(error){

        return {};

    }

}


function saveSettings(data){

    localStorage.setItem(
        "adminSettings",
        JSON.stringify(data)
    );

}


function getElement(id){

    return document.getElementById(id);

}


function closePanel(panelId){

    getElement(panelId)
    .classList.remove("show");

}



/* =====================================================
   2. FIRST LETTER CAPITAL
===================================================== */

function firstLetterCapital(text){

    text =
    String(text || "").trim();

    if(text===""){
        return "";
    }

    return (
        text.charAt(0).toUpperCase()
        +
        text.slice(1)
    );

}



/* =====================================================
   3. LOAD OLD SAVED SETTINGS
===================================================== */

function loadAdminSettings(){

    let data =
    getSettings();


    getElement("depositLimit").value =
    data.depositLimit || 100;


    getElement("withdrawLimit").value =
    data.withdrawLimit || 1000;


    getElement("upiId").value =
    data.upiId || "";


    getElement("qrUpiId").value =
    data.qrUpiId || "";


    getElement("qrCode").value =
    data.qrCode || "";


    getElement("notification").value =
    data.notification || "";


    getElement("whatsapp").value =
    data.whatsapp || "";


    getElement("telegram").value =
    data.telegram || "";


    getElement("youtube").value =
    data.youtube || "";


    getElement("withdrawRequestLimit").value =
    data.withdrawRequestLimit || 2;


    getElement("password").value =
    data.password || "";


    getElement("adminMobile").value =
    data.adminMobile || "";


    getElement("gpay").value =
    data.gpay || "";


    getElement("phonepe").value =
    data.phonepe || "";


    getElement("paytm").value =
    data.paytm || "";


    getElement("whatsappGroup").value =
    data.whatsappGroup || "";


    getElement("appNameText").innerText =
    data.appName || "HR_Matka";


    getElement("appNameEdit").value =
    data.appName || "HR_Matka";


    setStatusButton(
        "upiStatusBtn",
        data.upiStatus
    );


    setStatusButton(
        "gatewayStatusBtn",
        data.gatewayStatus
    );


    setStatusButton(
        "qrStatusBtn",
        data.qrStatus
    );


    setStatusButton(
        "utrStatusBtn",
        data.utrStatus
    );


    setStatusButton(
        "autoVerifyBtn",
        data.autoVerifyRegistration
    );


    setBigStatusButton(
        "imbStatusBtn",
        data.imbStatus
    );


    setBigStatusButton(
        "pocketStatusBtn",
        data.pocketStatus
    );


    selectGateway(
        data.gatewayType || "IMB",
        false
    );


    updateTimeDisplay();

}



/* =====================================================
   4. SAVE ALL MAIN SETTINGS
===================================================== */

function saveAllSettings(){

    let data =
    getSettings();


    data.depositLimit =
    Number(
        getElement("depositLimit").value
    );


    data.withdrawLimit =
    Number(
        getElement("withdrawLimit").value
    );


    data.upiId =
    getElement("upiId").value.trim();


    data.qrUpiId =
    getElement("qrUpiId").value.trim();


    data.qrCode =
    getElement("qrCode").value.trim();


    data.notification =
    firstLetterCapital(
        getElement("notification").value
    );


    data.whatsapp =
    getElement("whatsapp").value.trim();


    data.telegram =
    getElement("telegram").value.trim();


    data.youtube =
    getElement("youtube").value.trim();


    data.withdrawRequestLimit =
    Number(
        getElement("withdrawRequestLimit").value
    );


    data.password =
    getElement("password").value;

/* =====================================================
   9. TIME SETTING
===================================================== */

const weekDays = [

    "Sunday",

    "Monday",

    "Tuesday",

    "Wednesday",

    "Thursday",

    "Friday",

    "Saturday"

];


let currentTimeType =
"withdrawal";


let currentDay =
"Monday";


function defaultTime(type){

    if(type==="withdrawal"){

        return {

            open:"10:00:00",

            close:"20:00:00"

        };

    }


    return {

        open:"02:00:00",

        close:"23:59:00"

    };

}


function getSavedTime(type, day){

    let data =
    getSettings();


    let allTimes =
    data[type+"Times"] || {};


    return (
        allTimes[day]
        ||
        defaultTime(type)
    );

}


function openTimePanel(type){

    currentTimeType =
    type;


    currentDay =
    "Monday";


    createDayButtons();


    loadSelectedDayTime();


    getElement("timePanel")
    .classList.add("show");

}


function createDayButtons(){

    let html =
    "";


    weekDays.forEach(function(day){

        let activeClass =
        day===currentDay
        ?
        "active"
        :
        "";


        html +=

        '<button class="day-btn '
        +
        activeClass
        +
        '" onclick="selectDay(\''
        +
        day
        +
        '\')">'
        +
        day
        +
        '</button>';

    });


    getElement("dayButtons").innerHTML =
    html;

}


function selectDay(day){

    currentDay =
    day;


    createDayButtons();


    loadSelectedDayTime();

}


function loadSelectedDayTime(){

    let time =
    getSavedTime(
        currentTimeType,
        currentDay
    );


    getElement("selectedDayTitle").innerText =
    currentDay;


    getElement("timeOpen").value =
    time.open;


    getElement("timeClose").value =
    time.close;

}


function saveTimeSetting(){

    let data =
    getSettings();


    let key =
    currentTimeType
    +
    "Times";


    if(!data[key]){

        data[key] = {};

    }


    data[key][currentDay] = {

        open:
        getElement("timeOpen").value,

        close:
        getElement("timeClose").value

    };


    saveSettings(data);


    updateTimeDisplay();


    alert(
        "Time Setting Updated Successfully"
    );

}


function updateTimeDisplay(){

    let withdrawalTime =
    getSavedTime(
        "withdrawal",
        "Monday"
    );


    let depositTime =
    getSavedTime(
        "deposit",
        "Monday"
    );


    getElement("withdrawTimeText").innerText =

    withdrawalTime.open
    +
    " - "
    +
    withdrawalTime.close;


    getElement("depositTimeText").innerText =

    depositTime.open
    +
    " - "
    +
    depositTime.close;

}

function fileToBase64(file){

    return new Promise(
        function(resolve, reject){

            let reader =
            new FileReader();


            reader.onload =
            function(){

                resolve(
                    reader.result
                );

            };


            reader.onerror =
            reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


async function saveBanners(){

    let data =
    getSettings();


    let oldBanners =
    data.banners || [

        "images/banner1.jpeg",

        "images/banner2.jpeg",

        "images/banner3.jpeg"

    ];


    let bannerInputs = [

        getElement("banner1"),

        getElement("banner2"),

        getElement("banner3")

    ];


    for(
        let i=0;
        i<bannerInputs.length;
        i++
    ){

        let file =
        bannerInputs[i].files[0];


        if(file){

            oldBanners[i] =
            await fileToBase64(
                file
            );

        }

    }


    data.banners =
    oldBanners;


    saveSettings(data);


    alert(
        "Banner Images Updated Successfully"
    );

}

"input",
function(event){

    let element =
    event.target;


    if(
        element.type==="text"
        ||
        element.tagName==="TEXTAREA"
    ){

        let value =
        element.value;


        if(value.length===1){

            element.value =
            value.toUpperCase();

        }

    }

}
);
