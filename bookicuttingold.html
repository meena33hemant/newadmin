<script>

// =====================================
// BOOKI CUTTING FINAL
// =====================================

let activeCutPercent = 0;


// =====================================
// DATE FORMAT
// =====================================

function getTodayISO(){

let d = new Date();

let y = d.getFullYear();

let m =
String(d.getMonth()+1)
.padStart(2,"0");

let day =
String(d.getDate())
.padStart(2,"0");

return y+"-"+m+"-"+day;

}


function isoToDisplay(iso){

if(!iso){
return "";
}

let p = iso.split("-");

return p[2]+"/"+p[1]+"/"+p[0];

}


function normalizeDate(value){

if(!value){
return "";
}

value = String(value).trim();


// DD/MM/YYYY

let match =
value.match(
/^(\d{1,2})\/(\d{1,2})\/(\d{4})/
);

if(match){

return (
match[3] +
"-" +
String(match[2]).padStart(2,"0") +
"-" +
String(match[1]).padStart(2,"0")
);

}


// MM/DD/YYYY

let usa =
value.match(
/^(\d{1,2})\/(\d{1,2})\/(\d{4})/
);

if(usa){

return (
usa[3] +
"-" +
String(usa[1]).padStart(2,"0") +
"-" +
String(usa[2]).padStart(2,"0")
);

}


// YYYY-MM-DD

if(
/^\d{4}-\d{2}-\d{2}/
.test(value)
){

return value.substring(0,10);

}


// Javascript Date

let d = new Date(value);

if(!isNaN(d.getTime())){

let y = d.getFullYear();

let m =
String(d.getMonth()+1)
.padStart(2,"0");

let day =
String(d.getDate())
.padStart(2,"0");

return y+"-"+m+"-"+day;

}

return "";

}



function openBookiCalendar(){

let input =
document.getElementById(
"cuttingDate"
);

if(!input){
return;
}

/*
Chrome / Edge desktop me showPicker direct user click par
calendar kholta hai. Fallback ke liye temporary pointer-events
enable karke focus/click bhi kiya gaya hai.
*/

if(
typeof input.showPicker === "function"
){

try{

input.showPicker();

return;

}
catch(error){

console.warn(
"Calendar showPicker fallback",
error
);

}

}

try{

input.style.pointerEvents = "auto";

input.focus({
preventScroll:true
});

input.click();

setTimeout(function(){

input.style.pointerEvents = "none";

},50);

}
catch(error){

input.style.pointerEvents = "none";

console.error(
"Calendar Open Error",
error
);

}

}


// =====================================
// SET TODAY DATE
// =====================================

function setInitialDate(){

let today =
getTodayISO();

document.getElementById(
"cuttingDate"
).value = today;

document.getElementById(
"dateText"
).innerHTML =
isoToDisplay(today);

}

setInitialDate();


// =====================================
// DATE CHANGE
// =====================================

function dateChanged(){

let value =
document.getElementById(
"cuttingDate"
).value;

if(!value){
return;
}

document.getElementById(
"dateText"
).innerHTML =
isoToDisplay(value);

activeCutPercent = 0;

hideCutInfo();

/* Purani date select karne par market list wahi rahegi.
   Market pe click karne par us date ki cutting khulegi. */

let market =
document.getElementById(
"marketSelect"
).value;

if(market){

loadMarketCutting();

}

}



// =====================================
// USER-APP STYLE MARKET CARD HELPERS
// =====================================

let bookiLiveResults = {};

function normalizeMarketKey(value){

return String(
value || ""
)
.trim()
.toUpperCase();

}


function timeToMinutes(value){

let textValue =
String(
value || ""
)
.trim();

if(!textValue){
return null;
}

let parts =
textValue.split(":");

if(parts.length < 2){
return null;
}

let h =
Number(parts[0]);

let m =
Number(parts[1]);

if(
!Number.isFinite(h)
||
!Number.isFinite(m)
){
return null;
}

return (h * 60) + m;

}


function getBookiMarketStatus(item){

let now =
new Date();

let current =
(now.getHours() * 60)
+
now.getMinutes();

let openMinutes =
timeToMinutes(
item.openTime || item.open
);

let closeMinutes =
timeToMinutes(
item.closeTime || item.close
);

let live =
bookiLiveResults[
normalizeMarketKey(item.market)
] || null;

let result =
live && live.result
?
String(live.result)
:
"***-**-***";

let complete =
(
live
&&
String(live.status || "").toUpperCase() === "COMPLETE"
)
||
(
result.indexOf("***") === -1
&&
result.split("-").length >= 3
);

let openSaved =
result !== "***-**-***"
&&
result.split("-")[0]
&&
result.split("-")[0] !== "***";

if(
closeMinutes !== null
&&
current >= closeMinutes
){

return {
label:"CLOSED",
className:"status-closed",
icon:"×",
result:result
};

}

if(openSaved && !complete){

return {
label:"RUNNING CLOSE",
className:"status-running-close",
icon:"◷",
result:result
};

}

return {
label:"RUNNING",
className:"status-running",
icon:"▶",
result:result
};

}


async function syncBookiLiveResults(){

try{

let response =
await fetch(
"http://127.0.0.1:5000/api/live/results",
{
cache:"no-store"
}
);

if(!response.ok){
return;
}

let data =
await response.json();

let records =
Array.isArray(data)
?
data
:
(
Array.isArray(data.records)
?
data.records
:
[]
);

let next = {};

records.forEach(function(record){

if(!record || !record.market){
return;
}

next[
normalizeMarketKey(record.market)
] = record;

});

bookiLiveResults = next;

loadMarkets();

}
catch(error){

// Server unavailable ho to cutting system fir bhi chalega.

}

}


function showMarketDetail(){

let shell =
document.getElementById(
"marketListShell"
);

let controls =
document.getElementById(
"detailControls"
);

let back =
document.getElementById(
"detailBackWrap"
);

let area =
document.getElementById(
"cuttingArea"
);

if(shell){
shell.style.display = "none";
}

if(controls){
controls.style.display = "flex";
}

if(back){
back.style.display = "block";
}

if(area){
area.style.display = "block";
}

}


function backToMarketCards(){

let shell =
document.getElementById(
"marketListShell"
);

let controls =
document.getElementById(
"detailControls"
);

let back =
document.getElementById(
"detailBackWrap"
);

let area =
document.getElementById(
"cuttingArea"
);

if(shell){
shell.style.display = "block";
}

if(controls){
controls.style.display = "none";
}

if(back){
back.style.display = "none";
}

if(area){
area.style.display = "none";
}

activeCutPercent = 0;

hideCutInfo();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


// =====================================
// LOAD MARKETS
// =====================================

function loadMarkets(){

let markets =
JSON.parse(
localStorage.getItem("markets")
) || [];

let select =
document.getElementById(
"marketSelect"
);

let cards =
document.getElementById(
"marketCards"
);

select.innerHTML =
`<option value="">Select Market</option>`;

cards.innerHTML = "";

markets.forEach(function(item){

if(!item.market){
return;
}

select.innerHTML +=
`
<option value="${item.market}">
${item.market}
</option>
`;

let openTime =
String(
item.openTime ||
item.open ||
"--:--"
);

let closeTime =
String(
item.closeTime ||
item.close ||
"--:--"
);

let safeMarket =
encodeURIComponent(
item.market
);

let cardState =
getBookiMarketStatus(
item
);

cards.innerHTML +=
`
<div
class="market-card"
data-market="${item.market}"
onclick="selectMarketCard('${safeMarket}')">

<div class="market-card-left">

<div class="market-card-name">
${item.market}
</div>

<div class="market-card-result">
${cardState.result}
</div>

<div class="market-card-time">
${openTime} - ${closeTime}
</div>

</div>

<div class="market-card-right">

<div class="market-status-circle ${cardState.className}">
${cardState.icon}
</div>

<div class="market-status-text">
${cardState.label}
</div>

</div>

<div class="market-card-arrow">›</div>

</div>
`;

});

}


function selectMarketCard(encodedMarket){

let market =
decodeURIComponent(
encodedMarket
);

let select =
document.getElementById(
"marketSelect"
);

select.value = market;

document
.querySelectorAll(
".market-card"
)
.forEach(function(card){

card.classList.toggle(
"active",
card.getAttribute("data-market") === market
);

});

activeCutPercent = 0;

hideCutInfo();

/* Market card click -> detail screen open */
showMarketDetail();

let marketValue =
document.getElementById(
"marketSelect"
).value;

if(marketValue){
loadMarketCutting();
}

let area =
document.getElementById(
"cuttingArea"
);

if(area){

area.scrollIntoView({
behavior:"smooth",
block:"start"
});

}

}


loadMarkets();


// =====================================
// GET SELECTED DATE BETS
// =====================================

function getSelectedBets(){

let market =
document.getElementById(
"marketSelect"
).value;

let selectedDate =
document.getElementById(
"cuttingDate"
).value;

let bets =
JSON.parse(
localStorage.getItem("bets")
) || [];

return bets.filter(function(bet){

let sameMarket =
String(bet.market || "").trim()
==
String(market).trim();

let betDate =
normalizeDate(bet.date);

let sameDate =
betDate == selectedDate;

return sameMarket && sameDate;

});

}


// =====================================
// DETECT SESSION
// =====================================

function getBetSession(bet){

let session =
String(
bet.session || ""
).toLowerCase();

let game =
String(
bet.game ||
bet.gameType ||
""
).toLowerCase();

if(
session=="open" ||
game.includes("open")
){

return "Open";

}

if(
session=="close" ||
game.includes("close")
){

return "Close";

}

return "";

}


// =====================================
// CLEAN GAME NAME
// =====================================

function cleanGameName(bet){

let game =
String(
bet.game ||
bet.gameType ||
"Other"
);

game =
game.replace(
/\s+Open$/i,
""
);

game =
game.replace(
/\s+Close$/i,
""
);

return game.trim();

}


// =====================================
// GROUP DATA
// =====================================

function groupBets(bets){

let groups = {};

bets.forEach(function(bet){

let game =
cleanGameName(bet);

let number =
String(
bet.number ?? "-"
);

let amount =
Number(
bet.amount || 0
);

if(!groups[game]){

groups[game] = {};

}

if(!groups[game][number]){

groups[game][number] = 0;

}

groups[game][number] += amount;

});

return groups;

}


// =====================================
// CUT AMOUNT
// Example 30% cutting:
// ₹10 -> ₹7
// =====================================

function getFinalAmount(amount){

amount =
Number(amount || 0);

if(activeCutPercent<=0){

return amount;

}

let remainingPercent =
100 - activeCutPercent;

return (
amount *
remainingPercent /
100
);

}


// =====================================
// NUMBER FORMAT
// =====================================

function formatAmount(amount){

let num =
Number(amount || 0);

if(
Number.isInteger(num)
){

return num;

}

return Number(
num.toFixed(2)
);

}


// =====================================
// LOAD CUTTING
// =====================================

function loadMarketCutting(){

let market =
document.getElementById(
"marketSelect"
).value;

let area =
document.getElementById(
"cuttingArea"
);

if(market==""){

area.innerHTML="";

return;

}

let bets =
getSelectedBets();

let openBets =
bets.filter(function(bet){

return getBetSession(bet)=="Open";

});

let closeBets =
bets.filter(function(bet){

return getBetSession(bet)=="Close";

});

area.innerHTML =
createSession(
market,
"Open",
openBets
)
+
createSession(
market,
"Close",
closeBets
);

}


// =====================================
// CREATE SESSION
// =====================================

function createSession(
market,
session,
bets
){

let grouped =
groupBets(bets);

let text = "";

let total = 0;

Object.keys(grouped)
.forEach(function(game){

text +=
`================
*${game}*
================
`;

Object.keys(
grouped[game]
).forEach(function(number){

let original =
grouped[game][number];

let finalAmount =
getFinalAmount(original);

total += finalAmount;

text +=
`${number} = ₹ ${formatAmount(finalAmount)}
`;

});

text += "\n";

});


if(
Object.keys(grouped).length==0
){

text =
`================
No Bidding Found
================

`;

}


text +=
`================
*Total : ₹ ${formatAmount(total)}*
================`;

let safeId =
(
market +
session
)
.replace(
/[^a-zA-Z0-9]/g,
""
);

return `

<div class="market-box">

<div class="market-title">
Market : ${market}
</div>

<div class="session-title">
Session : ${session}
</div>

<button
class="copy-btn"
onclick="copyMarketData('${safeId}')">

Copy "${session}" Market Cutting

</button>

<div
class="data-text"
id="${safeId}">

*Market : ${market} - ${session.toUpperCase()}*

${text}

</div>

<div class="total-box">
Total: ₹ ${formatAmount(total)}
</div>

</div>

`;

}


// =====================================
// MAIN DATA
// =====================================

function showMainData(){

let market =
document.getElementById(
"marketSelect"
).value;

if(market==""){

alert(
"Please Select Market"
);

return;

}

activeCutPercent = 0;

hideCutInfo();

loadMarketCutting();

}


// =====================================
// CUTTING POPUP
// =====================================

function openCuttingPopup(){

let market =
document.getElementById(
"marketSelect"
).value;

if(market==""){

alert(
"Please Select Market First"
);

return;

}

document.getElementById(
"cuttingPopup"
).style.display =
"flex";

document.getElementById(
"cutPercent"
).focus();

}


function closeCuttingPopup(){

document.getElementById(
"cuttingPopup"
).style.display =
"none";

}


// =====================================
// APPLY CUTTING
// =====================================

function applyCutting(){

let percent =
Number(
document.getElementById(
"cutPercent"
).value
);

if(
isNaN(percent) ||
percent < 0 ||
percent > 100
){

alert(
"Please Enter Cutting Percent Between 0 And 100"
);

return;

}

activeCutPercent = percent;

document.getElementById(
"cutInfo"
).style.display =
"block";

document.getElementById(
"cutInfo"
).innerHTML =
percent +
"% Cutting Applied — Showing Remaining " +
(100-percent) +
"% Amount";

closeCuttingPopup();

loadMarketCutting();

document.getElementById(
"cutPercent"
).value="";

}


// =====================================
// HIDE CUT INFO
// =====================================

function hideCutInfo(){

document.getElementById(
"cutInfo"
).style.display =
"none";

}


// =====================================
// COPY
// =====================================

function copyMarketData(id){

let el =
document.getElementById(id);

if(!el){

return;

}

let text =
el.innerText;

if(
navigator.clipboard
){

navigator.clipboard
.writeText(text)
.then(function(){

alert(
"Market Cutting Copied Successfully"
);

})
.catch(function(){

fallbackCopy(text);

});

}else{

fallbackCopy(text);

}

}


function fallbackCopy(text){

let area =
document.createElement(
"textarea"
);

area.value = text;

document.body.appendChild(
area
);

area.select();

document.execCommand(
"copy"
);

area.remove();

alert(
"Market Cutting Copied Successfully"
);

}


// =====================================
// AUTO SELECT FIRST MARKET
// =====================================

let marketSelect =
document.getElementById(
"marketSelect"
);

if(
marketSelect.options.length > 1
){

marketSelect.selectedIndex = 1;

let firstMarket =
marketSelect.value;

document
.querySelectorAll(
".market-card"
)
.forEach(function(card){

card.classList.toggle(
"active",
card.getAttribute("data-market") === firstMarket
);

});

loadMarketCutting();

}


console.log(
"Booki Cutting FINAL FIXED V2 - Full Date Bar Calendar Working + Market Click + Original Cutting Logic"
);

</script>
