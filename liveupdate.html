<!-- =========================================================
     HR MATKA - ADMIN LOGIN PROTECTION

     Same exact sessionStorage system as:
     adminlogin.html
     protected index.html
     result.html
     marketsetting.html
     bookicutting.html
     users.html
     withdrawrequest.html
     sendnotification.html
     adminsetting.html
     ratelist.html

     Valid session = Live Update opens normally.
     Missing / expired session = adminlogin.html.
========================================================= -->

<script>

(function(){

    "use strict";


    const SESSION_KEY =
    "hrAdminSession";


    const LOGIN_PAGE =
    "adminlogin.html";


    try{

        const raw =
        sessionStorage.getItem(
            SESSION_KEY
        );


        const session =
        raw
        ?
        JSON.parse(raw)
        :
        null;


        const now =
        Date.now();


        if(
            !session
            ||
            session.loggedIn !== true
            ||
            !session.expiresAt
            ||
            now >= Number(session.expiresAt)
        ){

            sessionStorage.removeItem(
                SESSION_KEY
            );


            window.location.replace(
                LOGIN_PAGE
            );


            return;

        }


        console.log(
            "✅ Live Update Admin Login Protection Connected"
        );

    }
    catch(error){

        sessionStorage.removeItem(
            SESSION_KEY
        );


        window.location.replace(
            LOGIN_PAGE
        );

    }

})();

</script>


<div class="header">

<script>

"use strict";


/* =========================================================
   HR MATKA - LIVE UPDATE ENGINE
========================================================= */


/* =========================================================
   1. SAFE LOCAL STORAGE READ
========================================================= */

function getStorage(
key,
fallback
){

try{

const raw =
localStorage.getItem(
key
);


if(!raw){

return fallback;

}


return JSON.parse(
raw
);

}
catch(error){

console.warn(
"Storage Read Error:",
key,
error
);


return fallback;

}

}


/* =========================================================
   2. CAPITALIZE FIRST LETTER
========================================================= */

function capitalizeFirst(text){

text =
String(
text || ""
);


if(!text){

return "";

}


return (
text.charAt(0).toUpperCase()
+
text.slice(1)
);

}


/* =========================================================
   3. TITLE FIRST LETTER CAPITAL
========================================================= */

document
.getElementById(
"title"
)
.addEventListener(
"input",
function(){

let cursor =
this.selectionStart;


this.value =
capitalizeFirst(
this.value
);


this.setSelectionRange(
cursor,
cursor
);

}
);


/* =========================================================
   4. MESSAGE FIRST LETTER CAPITAL
========================================================= */

document
.getElementById(
"message"
)
.addEventListener(
"input",
function(){

let cursor =
this.selectionStart;


this.value =
capitalizeFirst(
this.value
);


this.setSelectionRange(
cursor,
cursor
);

}
);


/* =========================================================
   5. SAVE UPDATE
========================================================= */

function saveUpdate(){

let title =
document
.getElementById(
"title"
)
.value
.trim();


let message =
document
.getElementById(
"message"
)
.value
.trim();


/* =====================================================
   EMPTY CHECK
===================================================== */

if(
title === ""
||
message === ""
){

alert(
"Please Fill Title And Message"
);


return;

}


/* =====================================================
   FINAL CAPITAL FORMAT
===================================================== */

title =
capitalizeFirst(
title
);


message =
capitalizeFirst(
message
);


/* =====================================================
   LOAD OLD UPDATES
===================================================== */

let updates =
getStorage(
"updates",
[]
);


if(
!Array.isArray(
updates
)
){

updates = [];

}


/* =====================================================
   DATE + TIME
===================================================== */

let now =
new Date();


let date =
now.toLocaleDateString(
"en-GB"
);


let time =
now.toLocaleTimeString(
"en-US",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hour12:true
}
)
.replace(
/\bam\b/gi,
"AM"
)
.replace(
/\bpm\b/gi,
"PM"
);


/* =====================================================
   NEW UPDATE
===================================================== */

let newUpdate = {

id:
Date.now(),

title:
title,

message:
message,

date:
date,

time:
time,

status:
"Active",

createdAt:
now.toISOString()

};


/* =====================================================
   OLD ACTIVE UPDATE INACTIVE
   Only latest update stays active
===================================================== */

updates.forEach(
function(item){

item.status =
"Inactive";

}
);


/* =====================================================
   SAVE NEW UPDATE
===================================================== */

updates.push(
newUpdate
);


localStorage.setItem(

"updates",

JSON.stringify(
updates
)

);


/* =====================================================
   SAVE CURRENT LIVE UPDATE
   User App can read this directly
===================================================== */

localStorage.setItem(

"liveUpdate",

JSON.stringify(
newUpdate
)

);


/* =====================================================
   CLEAR FORM
===================================================== */

document
.getElementById(
"title"
)
.value =
"";


document
.getElementById(
"message"
)
.value =
"";


/* =====================================================
   REFRESH SCREEN
===================================================== */

loadLivePreview();


loadUpdateHistory();


alert(
"Live Update Published Successfully"
);

}


/* =========================================================
   6. LOAD LIVE PREVIEW
========================================================= */

function loadLivePreview(){

let liveUpdate =
getStorage(
"liveUpdate",
null
);


let preview =
document
.getElementById(
"livePreview"
);


if(!liveUpdate){

preview.innerHTML =
"No Live Update Available";


return;

}


preview.innerHTML =

'<span class="liveLabel">LIVE :</span>'
+
"<strong>"
+
escapeHTML(
liveUpdate.title || ""
)
+
"</strong> - "
+
escapeHTML(
liveUpdate.message || ""
);

}


/* =========================================================
   7. LOAD HISTORY
========================================================= */

function loadUpdateHistory(){

let updates =
getStorage(
"updates",
[]
);


if(
!Array.isArray(
updates
)
){

updates = [];

}


let history =
document
.getElementById(
"updateHistory"
);


history.innerHTML =
"";


if(
updates.length === 0
){

history.innerHTML =

'<div class="noData">No Update History Found</div>';


return;

}


/* Latest first */

let reversed =
updates
.slice()
.reverse();


reversed.forEach(
function(item){

let statusHTML =
"";


if(
item.status ===
"Active"
){

statusHTML =

'<div class="activeStatus">ACTIVE</div>';

}


history.innerHTML += `

<div class="updateCard">

<div class="updateTitle">
${escapeHTML(item.title || "")}
</div>

<div class="updateMessage">
${escapeHTML(item.message || "")}
</div>

<div class="updateTime">
${escapeHTML(item.date || "-")}
&nbsp; | &nbsp;
${escapeHTML(item.time || "-")}
</div>

${statusHTML}

<button
type="button"
class="deleteBtn"
onclick="deleteUpdate(${Number(item.id)})">

DELETE

</button>

</div>

`;

}
);

}


/* =========================================================
   8. DELETE UPDATE
========================================================= */

function deleteUpdate(id){

if(
!confirm(
"Do You Want To Delete This Live Update?"
)
){

return;

}


let updates =
getStorage(
"updates",
[]
);


if(
!Array.isArray(
updates
)
){

updates = [];

}


updates =
updates.filter(
function(item){

return (
Number(
item.id
)
!==
Number(
id
)
);

}
);


/* =====================================================
   RESET ACTIVE STATUS
===================================================== */

updates.forEach(
function(item){

item.status =
"Inactive";

}
);


/* Latest remaining becomes active */

if(
updates.length > 0
){

updates[
updates.length - 1
]
.status =
"Active";


localStorage.setItem(

"liveUpdate",

JSON.stringify(
updates[
updates.length - 1
]
)

);

}
else{

localStorage.removeItem(
"liveUpdate"
);

}


localStorage.setItem(

"updates",

JSON.stringify(
updates
)

);


loadLivePreview();


loadUpdateHistory();

}


/* =========================================================
   9. SAFE DISPLAY TEXT
========================================================= */

function escapeHTML(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/* =========================================================
   10. LIVE UPDATE FROM OTHER TAB
========================================================= */

window.addEventListener(
"storage",
function(event){

if(
event.key ===
"updates"
||
event.key ===
"liveUpdate"
){

loadLivePreview();


loadUpdateHistory();

}

}
);


/* =========================================================
   11. FIRST LOAD
========================================================= */

loadLivePreview();


loadUpdateHistory();


/* =========================================================
   12. CONSOLE READY
========================================================= */

console.log(
"✅ Live Update Final Connected Successfully"
);


console.log(
"✅ Live Update Admin Login Protection Connected"
);


console.log(
"✅ Live Update History + Active Update Connected"
);


console.log(
"✅ User App liveUpdate Storage Connected"
);

</script>


</body>
