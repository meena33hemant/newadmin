<script>

"use strict";


/* =====================================================
   HR MATKA ADMIN PANEL
   MANUAL PAYMENT
   FINAL EXACT-AMOUNT ENGINE
===================================================== */



let selectedUser =
null;


let isSubmitting =
false;



/* =====================================================
   SAFE STORAGE
===================================================== */

function getStorage(
    key,
    fallback
){

    try{

        let raw =
        localStorage.getItem(
            key
        );


        if(
            raw === null ||
            raw === undefined ||
            raw === ""
        ){

            return fallback;

        }


        return JSON.parse(
            raw
        );

    }
    catch(error){

        console.error(
            "Storage Read Error:",
            key,
            error
        );


        return fallback;

    }

}



/* =====================================================
   MOBILE
===================================================== */

function normalizeMobile(value){

    return String(
        value || ""
    )
    .replace(
        /\D/g,
        ""
    )
    .slice(
        0,
        10
    );

}



/* =====================================================
   NAME
===================================================== */

function capitalizeName(name){

    return String(
        name || ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /\b[a-z]/g,
        function(letter){

            return letter.toUpperCase();

        }
    );

}



/* =====================================================
   DATE + TIME
===================================================== */

function getCurrentDateTime(){

    let now =
    new Date();


    let displayTime =
    now.toLocaleTimeString(
        "en-US",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    )
    .replace(
        /\bam\b/gi,
        "AM"
    )
    .replace(
        /\bpm\b/gi,
        "PM"
    );


    return {

        date:
        now.toLocaleDateString(
            "en-GB"
        ),

        time:
        displayTime,

        timestamp:
        now.getTime(),

        iso:
        now.toISOString()

    };

}



/* =====================================================
   TODAY ISO
===================================================== */

function getTodayISO(){

    let now =
    new Date();


    return (

        now.getFullYear()

        +

        "-"

        +

        String(
            now.getMonth()+1
        )
        .padStart(
            2,
            "0"
        )

        +

        "-"

        +

        String(
            now.getDate()
        )
        .padStart(
            2,
            "0"
        )

    );

}



/* =====================================================
   NORMALIZE DATE
===================================================== */

function normalizeDate(value){

    if(!value){

        return "";

    }


    let text =
    String(
        value
    )
    .trim();


    let slash =
    text.match(
        /^(\d{1,2})\/(\d{1,2})\/(\d{4})/
    );


    if(slash){

        return (

            slash[3]

            +

            "-"

            +

            String(
                slash[2]
            )
            .padStart(
                2,
                "0"
            )

            +

            "-"

            +

            String(
                slash[1]
            )
            .padStart(
                2,
                "0"
            )

        );

    }


    if(
        /^\d{4}-\d{2}-\d{2}/
        .test(
            text
        )
    ){

        return text.substring(
            0,
            10
        );

    }


    let parsed =
    new Date(
        text
    );


    if(
        isNaN(
            parsed.getTime()
        )
    ){

        return "";

    }


    return (

        parsed.getFullYear()

        +

        "-"

        +

        String(
            parsed.getMonth()+1
        )
        .padStart(
            2,
            "0"
        )

        +

        "-"

        +

        String(
            parsed.getDate()
        )
        .padStart(
            2,
            "0"
        )

    );

}



/* =====================================================
   TRANSACTION ID
===================================================== */

function createTransactionId(){

    let now =
    Date.now();


    let random =
    Math.floor(
        100000 +
        Math.random() *
        900000
    );


    return (

        "MP-"

        +

        now

        +

        "-"

        +

        random

    );

}



/* =====================================================
   CLEAR USER
===================================================== */

function clearUserDetails(){

    selectedUser =

    document

        "username"

    document
    .getElementById(
        "walletAmount"

    document
    .getElementById(
        "bankName"
    )
    .value =

    document
    .getElementById(

    )
    .value =
    "";


    document
    .getElementById(
        "ifscCode"
    )
    .value =
    "";


    document
    .getElementById(
        "upiId"
    )
    .value =
    "";

}



/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    type
){

    let box =
    document
    .getElementById(
        "userStatus"
    );


    box.style.display =
    "block";


    box.className =

    "user-status "

    +

    (
        type === "success"
        ?
        "user-found"
        :
        "user-not-found"
    );


    box.textContent =
    message;

}



function hideStatus(){

    document
    .getElementById(
        "userStatus"
    )
    .style.display =
    "none";

}



/* =====================================================
   BALANCE KEY
===================================================== */

function findBalanceKey(
    balances,
    mobile
){

    let normalized =
    normalizeMobile(
        mobile
    );


    let keys =
    Object.keys(
        balances
    );


    let found =
    keys.find(
        function(key){

            return (
                normalizeMobile(
                    key
                )
                ===
                normalized
            );

        }
    );


    return (
        found ||
        normalized
    );

}



/* =====================================================
   FIND USER
===================================================== */

function findUser(){

    let mobile =
    normalizeMobile(
        document
        .getElementById(
            "mobile"
        )
        .value
    );


    clearUserDetails();


    if(
        mobile.length ===
        0
    ){

        hideStatus();

        return;

    }


    if(
        mobile.length !==
        10
    ){

        showStatus(
            "Enter Complete 10 Digit Mobile Number",
            "error"
        );


        return;

    }


    let users =
    getStorage(
        "users",
        []
    );


    if(
        !Array.isArray(
            users
        )
    ){

        users = [];

    }


    let user =
    users.find(
        function(item){

            return (

                normalizeMobile(
                    item.mobile
                )

                ===

                mobile

            );

        }
    );


    if(!user){

        showStatus(
            "User Not Found",
            "error"
        );


        return;

    }


    selectedUser =
    user;


    document
    .getElementById(
        "username"
    )
    .value =
    capitalizeName(
        user.name
    );



    let balances =
    getStorage(
        "userBalances",
        {}
    );


    if(
        !balances ||
        Array.isArray(
            balances
        ) ||
        typeof balances !==
        "object"
    ){

        balances = {};

    }


    let balanceKey =
    findBalanceKey(
        balances,
        mobile
    );


    let balance =
    Number(
        balances[
            balanceKey
        ] || 0
    );


    if(
        !Number.isFinite(
            balance
        )
    ){

        balance = 0;

    }


    document
    .getElementById(
        "walletAmount"
    )
    .innerText =
    balance.toFixed(
        2
    );



    let bankDetails =
    getStorage(
        "bankDetails",
        {}
    );


    if(
        !bankDetails ||
        Array.isArray(
            bankDetails
        ) ||
        typeof bankDetails !==
        "object"
    ){

        bankDetails = {};

    }


    let bank =
    bankDetails[mobile] ||
    bankDetails[balanceKey] ||
    {};


    document
    .getElementById(
        "bankName"
    )
    .value =

    bank.bankName ||

    bank.bank ||

    user.bankName ||

    user.bank ||

    "";


    document
    .getElementById(
        "accountNumber"
    )
    .value =

    bank.accountNumber ||

    bank.accountNo ||

    bank.number ||

    user.accountNumber ||

    user.accountNo ||

    "";


    document
    .getElementById(
        "ifscCode"
    )
    .value =

    bank.ifscCode ||

    bank.ifsc ||

    user.ifscCode ||

    user.ifsc ||

    "";


    document
    .getElementById(
        "upiId"
    )
    .value =

    bank.upiId ||

    bank.upi ||

    user.upiId ||

    user.upi ||

    "";



    let upiDetails =
    getStorage(
        "upiDetails",
        {}
    );


    if(
        !upiDetails ||
        Array.isArray(
            upiDetails
        ) ||
        typeof upiDetails !==
        "object"
    ){

        upiDetails = {};

    }


    let upiRecord =
    upiDetails[mobile] ||
    upiDetails[balanceKey] ||
    {};


    if(
        !document
        .getElementById(
            "upiId"
        )
        .value
    ){

        document
        .getElementById(
            "upiId"
        )
        .value =

        upiRecord.upiId ||

        upiRecord.upi ||

        "";

    }


    showStatus(
        "User Found ✓",
        "success"
    );

}



/* =====================================================
   EXACT AMOUNT INPUT

   IMPORTANT:
   Sirf digits allow honge.

   Mouse wheel se amount change nahi hoga.
===================================================== */

function sanitizeAmountInput(){

    let input =
    document
    .getElementById(
        "amount"
    );


    input.value =
    String(
        input.value || ""
    )
    .replace(
        /\D/g,
        ""
    );


    updateAmountPreview();

}



/* =====================================================
   PREVIEW
===================================================== */

function updateAmountPreview(){

    let rawAmount =
    document
    .getElementById(
        "amount"
    )
    .value
    .trim();


    let amount =
    Number(
        rawAmount
    );


    let previewBox =
    document
    .getElementById(
        "previewBox"
    );


    if(
        rawAmount === ""
        ||
        !Number.isFinite(
            amount
        )
        ||
        amount <= 0
    ){

        previewBox.style.display =
        "none";


        return;

    }


    document
    .getElementById(
        "previewAmount"
    )
    .innerText =

    "+ ₹ " +
    amount.toFixed(
        2
    );


    previewBox.style.display =
    "block";

}



/* =====================================================
   TODAY ADDED MONEY
===================================================== */

function calculateTodayAddedMoney(
    deposits
){

    let today =
    getTodayISO();


    let total =
    0;


    deposits.forEach(
        function(item){

            let status =
            String(
                item.status || ""
            )
            .trim()
            .toUpperCase();


            if(
                status !==
                "APPROVED"
            ){

                return;

            }


            let approvedDate =
            normalizeDate(

                item.approvedDate ||

                item.date

            );


            if(
                approvedDate ===
                today
            ){

                let amount =
                Number(
                    item.amount || 0
                );


                if(
                    Number.isFinite(
                        amount
                    )
                ){

                    total +=
                    amount;

                }

            }

        }
    );


    return total;

}



/* =====================================================
   SAFE COMMIT
===================================================== */

function commitStorageUpdates(
    updates
){

    let backups =
    {};


    try{

        Object.keys(
            updates
        )
        .forEach(
            function(key){

                backups[key] =
                localStorage.getItem(
                    key
                );

            }
        );


        Object.keys(
            updates
        )
        .forEach(
            function(key){

                let config =
                updates[key];


                if(
                    config.raw === true
                ){

                    localStorage.setItem(
                        key,
                        String(
                            config.value
                        )
                    );

                }

                else{

                    localStorage.setItem(
                        key,
                        JSON.stringify(
                            config.value
                        )
                    );

                }

            }
        );


        return true;

    }
    catch(error){

        console.error(
            "Manual Payment Commit Error:",
            error
        );


        Object.keys(
            backups
        )
        .forEach(
            function(key){

                try{

                    if(
                        backups[key] ===
                        null
                    ){

                        localStorage.removeItem(
                            key
                        );

                    }

                    else{

                        localStorage.setItem(
                            key,
                            backups[key]
                        );

                    }

                }
                catch(restoreError){

                    console.error(
                        "Rollback Error:",
                        key,
                        restoreError
                    );

                }

            }
        );


        return false;

    }

}



/* =====================================================
   SAVE PAYMENT
===================================================== */

function savePayment(){

    if(isSubmitting){

        return;

    }


    let mobile =
    normalizeMobile(
        document
        .getElementById(
            "mobile"
        )
        .value
    );


    let amountText =
    document
    .getElementById(
        "amount"
    )
    .value
    .trim();


    /*
       FINAL EXACT AMOUNT

       Example:
       "500" -> Number = 500

       Koi fee / deduction nahi.
    */

    let amount =
    Number(
        amountText
    );



    if(
        mobile.length !==
        10
    ){

        alert(
            "Please Enter Valid 10 Digit Mobile Number"
        );


        return;

    }



    if(
        amountText === ""
        ||
        !Number.isFinite(
            amount
        )
        ||
        amount <= 0
        ||
        !Number.isInteger(
            amount
        )
    ){

        alert(
            "Please Enter Valid Amount"
        );


        return;

    }



    let users =
    getStorage(
        "users",
        []
    );


    if(
        !Array.isArray(
            users
        )
    ){

        users = [];

    }


    let user =
    users.find(
        function(item){

            return (

                normalizeMobile(
                    item.mobile
                )

                ===

                mobile

            );

        }
    );


    if(!user){

        selectedUser =
        null;


        alert(
            "User Not Found"
        );


        findUser();


        return;

    }


    selectedUser =
    user;


    let userName =
    capitalizeName(
        user.name
    );



    let confirmed =
    confirm(

        "Manual Payment Confirm Karein?"

        +

        "\n\nUser: "

        +

        userName

        +

        "\nMobile: "

        +

        mobile

        +

        "\nAmount: ₹ "

        +

        amount.toFixed(2)

    );


    if(!confirmed){

        return;

    }



    isSubmitting =
    true;


    let submitButton =
    document
    .getElementById(
        "submitBtn"
    );


    submitButton.disabled =
    true;


    submitButton.innerText =
    "PROCESSING...";



    try{


        let balances =
        getStorage(
            "userBalances",
            {}
        );


        let payments =
        getStorage(
            "payments",
            []
        );


        let deposits =
        getStorage(
            "deposits",
            []
        );


        let passbook =
        getStorage(
            "passbook",
            []
        );


        if(
            !balances ||
            Array.isArray(
                balances
            ) ||
            typeof balances !==
            "object"
        ){

            balances = {};

        }


        if(
            !Array.isArray(
                payments
            )
        ){

            payments = [];

        }


        if(
            !Array.isArray(
                deposits
            )
        ){

            deposits = [];

        }


        if(
            !Array.isArray(
                passbook
            )
        ){

            passbook = [];

        }



        let balanceKey =
        findBalanceKey(
            balances,
            mobile
        );


        let previousBalance =
        Number(
            balances[
                balanceKey
            ] || 0
        );


        if(
            !Number.isFinite(
                previousBalance
            )
        ){

            previousBalance =
            0;

        }



        /*
           EXACT WALLET CALCULATION

           Previous 500
           Add 500
           New 1000

           No -2
           No fee
           No percentage
        */

        let currentBalance =
        previousBalance +
        amount;



        let transactionId =
        createTransactionId();


        let dateTime =
        getCurrentDateTime();



        let duplicate =
        deposits.some(
            function(item){

                return (

                    String(
                        item.transactionId || ""
                    )

                    ===

                    transactionId

                );

            }
        );


        if(duplicate){

            transactionId =
            createTransactionId();

        }



        let paymentRecord = {

            id:
            dateTime.timestamp,

            transactionId:
            transactionId,

            referenceId:
            transactionId,

            requestId:
            transactionId,

            username:
            userName,

            name:
            userName,

            mobile:
            mobile,

            amount:
            amount,

            date:
            dateTime.date,

            time:
            dateTime.time,

            approvedDate:
            dateTime.date,

            approvedTime:
            dateTime.time,

            paymentMode:
            "Manual Payment",

            type:
            "Manual Payment",

            status:
            "Approved",

            previousBalance:
            previousBalance,

            currentBalance:
            currentBalance,

            timestamp:
            dateTime.timestamp,

            createdTimestamp:
            dateTime.timestamp,

            approvedTimestamp:
            dateTime.timestamp,

            createdAt:
            dateTime.iso,

            approvedAt:
            dateTime.iso,

            source:
            "manualpayment.html"

        };


        payments.push(
            paymentRecord
        );



        let depositRecord = {

            id:
            dateTime.timestamp,

            transactionId:
            transactionId,

            referenceId:
            transactionId,

            requestId:
            transactionId,

            utr:
            transactionId,

            name:
            userName,

            username:
            userName,

            mobile:
            mobile,

            amount:
            amount,

            date:
            dateTime.date,

            time:
            dateTime.time,

            requestDate:
            dateTime.date,

            requestTime:
            dateTime.time,

            approvedDate:
            dateTime.date,

            approvedTime:
            dateTime.time,

            paymentMode:
            "Manual Payment",

            type:
            "Manual Payment",

            status:
            "Approved",

            walletCredited:
            true,

            walletCreditAmount:
            amount,

            previousBalance:
            previousBalance,

            currentBalance:
            currentBalance,

            timestamp:
            dateTime.timestamp,

            createdTimestamp:
            dateTime.timestamp,

            approvedTimestamp:
            dateTime.timestamp,

            updatedTimestamp:
            dateTime.timestamp,

            createdAt:
            dateTime.iso,

            approvedAt:
            dateTime.iso,

            updatedAt:
            dateTime.iso,

            source:
            "manualpayment.html"

        };


        deposits.push(
            depositRecord
        );



        balances[
            balanceKey
        ] =
        currentBalance;



        let transactionKey =

        "MANUAL_PAYMENT:"

        +

        transactionId;


        let passbookExists =
        passbook.some(
            function(item){

                return (

                    String(
                        item.transactionKey || ""
                    )

                    ===

                    transactionKey

                );

            }
        );


        if(
            !passbookExists
        ){

            passbook.push({

                id:
                dateTime.timestamp +
                Math.random(),

                transactionKey:
                transactionKey,

                transactionId:
                transactionId,

                referenceId:
                transactionId,

                requestId:
                transactionId,

                depositId:
                depositRecord.id,

                mobile:
                mobile,

                name:
                userName,

                type:
                "Deposit",

                details:
                "Manual Payment Deposit",

                previousBalance:
                previousBalance,

                amount:
                amount,

                currentBalance:
                currentBalance,

                date:
                dateTime.date,

                time:
                dateTime.time,

                status:
                "Success",

                timestamp:
                dateTime.timestamp,

                createdTimestamp:
                dateTime.timestamp,

                createdAt:
                dateTime.iso,

                source:
                "manualpayment.html"

            });

        }



        let todayAddedMoney =
        calculateTodayAddedMoney(
            deposits
        );


        let today =
        getTodayISO();



        let committed =
        commitStorageUpdates({

            payments:{
                value:
                payments
            },

            deposits:{
                value:
                deposits
            },

            userBalances:{
                value:
                balances
            },

            passbook:{
                value:
                passbook
            },

            todayAddedMoney:{
                value:
                todayAddedMoney,
                raw:true
            },

            todayAddedMoneyDate:{
                value:
                today,
                raw:true
            },

            lastManualPayment:{
                value:{

                    transactionId:
                    transactionId,

                    mobile:
                    mobile,

                    amount:
                    amount,

                    previousBalance:
                    previousBalance,

                    currentBalance:
                    currentBalance,

                    timestamp:
                    dateTime.timestamp

                }
            }

        });



        if(!committed){

            alert(
                "Manual Payment Save Failed.\n\nData ko safe rakhne ke liye transaction cancel kar diya gaya."
            );


            return;

        }



        document
        .getElementById(
            "popupMessage"
        )
        .innerHTML =

        "₹ "

        +

        amount.toFixed(2)

        +

        " successfully added to "

        +

        userName

        +

        ".<br><br>Previous Wallet: ₹ "

        +

        previousBalance.toFixed(2)

        +

        "<br>New Wallet Balance: ₹ "

        +

        currentBalance.toFixed(2);



        document
        .getElementById(
            "transactionRef"
        )
        .innerText =

        "Transaction ID: "

        +

        transactionId;



        document
        .getElementById(
            "popup"
        )
        .style.display =
        "flex";



        document
        .getElementById(
            "amount"
        )
        .value =
        "";


        updateAmountPreview();


        findUser();



        window.dispatchEvent(
            new Event(
                "manualPaymentUpdated"
            )
        );


        console.log(
            "✅ Exact Manual Payment Saved",
            {
                transactionId:
                transactionId,

                mobile:
                mobile,

                amount:
                amount,

                previousBalance:
                previousBalance,

                currentBalance:
                currentBalance
            }
        );


    }
    catch(error){

        console.error(
            "Manual Payment Error:",
            error
        );


        alert(
            "Manual Payment Process karte samay error aaya."
        );

    }

    finally{

        isSubmitting =
        false;


        submitButton.disabled =
        false;


        submitButton.innerText =
        "ADD AMOUNT";

    }

}



/* =====================================================
   CLOSE POPUP
===================================================== */

function closePopup(){

    document
    .getElementById(
        "popup"
    )
    .style.display =
    "none";

}



/* =====================================================
   MOBILE INPUT EVENT
===================================================== */

document
.getElementById(
    "mobile"
)
.addEventListener(
    "input",
    function(){

        this.value =
        normalizeMobile(
            this.value
        );


        findUser();

    }
);



/* =====================================================
   AMOUNT INPUT EVENT
===================================================== */

document
.getElementById(
    "amount"
)
.addEventListener(
    "input",
    sanitizeAmountInput
);



/* =====================================================
   IMPORTANT EXTRA PROTECTION

   Wheel event amount ko kabhi modify nahi karega.
===================================================== */

document
.getElementById(
    "amount"
)
.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();

        this.blur();

    },
    {
        passive:false
    }
);



/* =====================================================
   ENTER KEY
===================================================== */

document
.getElementById(
    "amount"
)
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();


            savePayment();

        }

    }
);



/* =====================================================
   SUBMIT BUTTON
===================================================== */

document
.getElementById(
    "submitBtn"
)
.addEventListener(
    "click",
    savePayment
);



/* =====================================================
   POPUP OUTSIDE CLICK
===================================================== */

document
.getElementById(
    "popup"
)
.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closePopup();

        }

    }
);



/* =====================================================
   STORAGE LIVE UPDATE
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === "users"

            ||

            event.key === "userBalances"

            ||

            event.key === "bankDetails"

            ||

            event.key === "upiDetails"
        ){

            let mobile =
            normalizeMobile(
                document
                .getElementById(
                    "mobile"
                )
                .value
            );


            if(
                mobile.length ===
                10
            ){

                findUser();

            }

        }

    }
);



/* =====================================================
   PAGE FOCUS
===================================================== */

window.addEventListener(
    "focus",
    function(){

        let mobile =
        normalizeMobile(
            document
            .getElementById(
                "mobile"
            )
            .value
        );


        if(
            mobile.length ===
            10
        ){

            findUser();

        }

    }
);



/* =====================================================
   FIRST LOAD
===================================================== */

clearUserDetails();

hideStatus();

updateAmountPreview();



console.log(
    "✅ HR MATKA Manual Payment FINAL EXACT AMOUNT Replacement Connected"
);


console.log(
    "✅ Mouse Wheel Amount Change Problem Fixed"
);


console.log(
    "✅ ₹500 Enter = Exact ₹500 Credit"
);


console.log(
    "✅ Wallet + Payments + Deposits + Passbook Connected"
);


console.log(
    "✅ Today Added Money + Dashboard Sync Connected"
);

</script>
