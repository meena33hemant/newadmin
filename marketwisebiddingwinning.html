



<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Market Wise Bidding Winning</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
color:#222;
padding:15px;
}

.container{
max-width:950px;
margin:auto;
}

.page-title{
font-size:38px;
font-weight:500;
margin:15px 0 25px;
}

.filter-card{
background:white;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
margin-bottom:25px;
overflow:hidden;
}

.filter-head{
padding:18px 22px;
font-size:24px;
border-bottom:1px solid #ddd;
}

.filter-body{
padding:22px;
}

.filter-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

label{
display:block;
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:14px;
font-size:17px;
border:1px solid #bbb;
border-radius:7px;
background:white;
}

.save-btn{
margin-top:22px;
padding:13px 25px;
border:none;
border-radius:6px;
background:#168dea;
color:white;
font-size:18px;
cursor:pointer;
}

.save-btn:hover{
background:#0879cc;
}

.summary-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-bottom:28px;
}

.summary{
padding:28px 20px;
border-radius:8px;
text-align:center;
box-shadow:0 2px 7px rgba(0,0,0,.18);
}

.summary h2{
font-size:35px;
margin-bottom:14px;
}

.summary p{
font-size:17px;
}

.bid-summary{
background:#25a9bc;
color:white;
}

.win-summary{
background:#ffc20d;
color:#1d2d3d;
}

.profit-summary{
background:#2eaf4b;
color:white;
}

.table-card{
background:white;
border-radius:9px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
padding:20px;
overflow:hidden;
}

.tools{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:16px;
}

.tool-btn{
padding:10px 17px;
border:none;
background:#737d86;
color:white;
font-size:15px;
border-radius:5px;
cursor:pointer;
}

.search-box{
margin-left:auto;
min-width:250px;
}

.search-box input{
padding:10px;
font-size:15px;
}

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:650px;
}

th,
td{
border:1px solid #ddd;
padding:15px 12px;
text-align:left;
}

th{
background:#fafafa;
font-size:17px;
}

tbody tr:nth-child(odd){
background:#f1f1f1;
}

.market-name{
font-size:17px;
}

.toggle-btn{
width:32px;
height:32px;
border-radius:50%;
border:none;
background:#158bd2;
color:white;
font-size:22px;
line-height:32px;
cursor:pointer;
box-shadow:0 1px 4px rgba(0,0,0,.4);
}

.toggle-btn.minus{
background:#db3038;
}

.detail-row{
display:none;
background:white !important;
}

.detail-box{
padding:8px 12px;
font-size:17px;
line-height:2;
}

.detail-box strong{
font-weight:700;
}

.pagination-info{
text-align:center;
padding:20px 0 5px;
font-size:16px;
}

.back-btn{
display:block;
text-align:center;
margin-top:20px;
background:#405665;
color:white;
text-decoration:none;
padding:14px;
border-radius:7px;
font-weight:bold;
}

@media(max-width:700px){

body{
padding:10px;
}

.page-title{
font-size:30px;
}

.filter-row{
grid-template-columns:1fr;
}

.summary-grid{
grid-template-columns:1fr;
}

.summary h2{
font-size:32px;
}

.search-box{
margin-left:0;
width:100%;
}

.search-box input{
width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<div class="page-title">
Market Wise<br>
Bidding/Winning
</div>


<div class="filter-card">

<div class="filter-head">
Filters
</div>

<div class="filter-body">

<div class="filter-row">

<div>

<label>
From Date
</label>

<input
type="date"
id="fromDate">

</div>


<div>

<label>
To Date
</label>

<input
type="date"
id="toDate">

</div>

</div>


<button
class="save-btn"
onclick="applyFilter()">

SAVE

</button>

</div>

</div>


<div class="summary-grid">

<div class="summary bid-summary">

<h2 id="totalBidding">
₹ 0.00
</h2>

<p>
TOTAL BIDDING
</p>

</div>


<div class="summary win-summary">

<h2 id="totalWinning">
₹ 0.00
</h2>

<p>
TOTAL WINNING
</p>

</div>


<div class="summary profit-summary">

<h2 id="totalProfit">
₹ 0.00
</h2>

<p>
Total Profit
</p>

</div>

</div>


<div class="table-card">

<div class="tools">

<button
class="tool-btn"
onclick="copyTable()">
Copy
</button>

<button
class="tool-btn"
onclick="refreshPage()">
Refresh
</button>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Search Market..."
oninput="renderTable()">

</div>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th style="width:85px;">
#
</th>

<th style="width:110px;">
Market ID
</th>

<th>
Market Name
</th>

</tr>

</thead>


<tbody id="marketTable">

</tbody>

</table>

</div>


<div
class="pagination-info"
id="recordInfo">

</div>

</div>


<a
href="index.html"
class="back-btn">

← Back To Admin Panel

</a>

</div>



<script>

// ==============================================
// MARKET WISE BIDDING / WINNING FINAL
// ==============================================


let selectedFromDate = "";
let selectedToDate = "";


// ==============================================
// DATE HELPERS
// ==============================================

function pad(value){

return String(value).padStart(2,"0");

}


function todayISO(){

let d = new Date();

return (
d.getFullYear() +
"-" +
pad(d.getMonth()+1) +
"-" +
pad(d.getDate())
);

}


function parseDateToISO(value){

if(!value){
return "";
}

value =
String(value)
.trim();


// YYYY-MM-DD

if(
/^\d{4}-\d{2}-\d{2}$/.test(value)
){

return value;

}


// DD/MM/YYYY

if(
/^\d{2}\/\d{2}\/\d{4}/.test(value)
){

let parts =
value.split(/[,\s]/)[0]
.split("/");

return (
parts[2] +
"-" +
parts[1] +
"-" +
parts[0]
);

}


// DD-MM-YYYY

if(
/^\d{2}-\d{2}-\d{4}/.test(value)
){

let parts =
value.split(/[,\s]/)[0]
.split("-");

return (
parts[2] +
"-" +
parts[1] +
"-" +
parts[0]
);

}


// TRY NATIVE DATE

let date =
new Date(value);

if(
!isNaN(date.getTime())
){

return (
date.getFullYear() +
"-" +
pad(date.getMonth()+1) +
"-" +
pad(date.getDate())
);

}

return "";

}


function isDateInRange(dateValue){

let iso =
parseDateToISO(dateValue);

if(!iso){
return false;
}

if(
selectedFromDate &&
iso < selectedFromDate
){
return false;
}

if(
selectedToDate &&
iso > selectedToDate
){
return false;
}

return true;

}


// ==============================================
// LOAD MARKETS
// ==============================================

function getMarkets(){

let markets =
JSON.parse(
localStorage.getItem("markets")
) || [];


// If markets storage empty,
// create market list from bets/results/winning

if(markets.length===0){

let marketNames = new Set();


let bets =
JSON.parse(
localStorage.getItem("bets")
) || [];

bets.forEach(function(item){

if(item.market){
marketNames.add(item.market);
}

});


let wins =
JSON.parse(
localStorage.getItem("todayWinning")
) || [];

wins.forEach(function(item){

if(item.market){
marketNames.add(item.market);
}

});


markets =
Array.from(marketNames)
.map(function(name,index){

return {
market:name,
id:index+1
};

});

}

return markets;

}


// ==============================================
// GET BETS
// ==============================================

function getBets(){

return (
JSON.parse(
localStorage.getItem("bets")
) || []
);

}


// ==============================================
// GET WINNING
// ==============================================

function getWinningData(){

let todayWinning =
JSON.parse(
localStorage.getItem("todayWinning")
) || [];

return todayWinning;

}


// ==============================================
// MARKET TOTAL BID
// ==============================================

function getMarketBidTotal(marketName){

let bets =
getBets();

let total = 0;

bets.forEach(function(bet){

if(
String(bet.market || "").trim()
.toLowerCase()
===
String(marketName).trim()
.toLowerCase()
&&
isDateInRange(bet.date)
){

total +=
Number(bet.amount || 0);

}

});

return total;

}


// ==============================================
// MARKET TOTAL WINNING
// ==============================================

function getMarketWinningTotal(marketName){

let wins =
getWinningData();

let total = 0;

wins.forEach(function(item){

if(
String(item.market || "").trim()
.toLowerCase()
===
String(marketName).trim()
.toLowerCase()
&&
isDateInRange(item.date)
){

total +=
Number(item.amount || 0);

}

});

return total;

}


// ==============================================
// FULL TOTALS
// ==============================================

function calculateSummary(){

let markets =
getMarkets();

let totalBid = 0;
let totalWin = 0;

markets.forEach(function(market){

let name =
market.market ||
market.name ||
market.marketName ||
"";

totalBid +=
getMarketBidTotal(name);

totalWin +=
getMarketWinningTotal(name);

});

let profit =
totalBid - totalWin;


document.getElementById(
"totalBidding"
).innerHTML =
"₹ " + totalBid.toFixed(2);


document.getElementById(
"totalWinning"
).innerHTML =
"₹ " + totalWin.toFixed(2);


document.getElementById(
"totalProfit"
).innerHTML =
"₹ " + profit.toFixed(2);

}


// ==============================================
// RENDER TABLE
// ==============================================

function renderTable(){

let markets =
getMarkets();

let table =
document.getElementById(
"marketTable"
);

let search =
document.getElementById(
"searchInput"
).value
.trim()
.toLowerCase();


table.innerHTML = "";


let filtered =
markets.filter(function(item){

let name =
item.market ||
item.name ||
item.marketName ||
"";

return (
search==="" ||
String(name)
.toLowerCase()
.includes(search)
);

});


if(filtered.length===0){

table.innerHTML = `

<tr>

<td
colspan="3"
style="text-align:center;padding:25px;">

No Market Found

</td>

</tr>

`;

document.getElementById(
"recordInfo"
).innerHTML =
"Showing 0 entries";

calculateSummary();

return;

}


filtered.forEach(function(item,index){

let marketName =
item.market ||
item.name ||
item.marketName ||
"Unknown Market";


let marketId =
item.id ||
item.marketId ||
(index+1);


let bidTotal =
getMarketBidTotal(
marketName
);


let winTotal =
getMarketWinningTotal(
marketName
);


let rowId =
"detail_" +
index;


table.innerHTML += `

<tr>

<td>

<button
class="toggle-btn"
id="btn_${index}"
onclick="toggleMarket('${rowId}','btn_${index}')">

+

</button>

&nbsp;

${index+1}

</td>

<td>
${marketId}
</td>

<td class="market-name">
${marketName}
</td>

</tr>


<tr
class="detail-row"
id="${rowId}">

<td colspan="3">

<div class="detail-box">

<div>

<strong>
Total Bid Amount
</strong>

₹ ${bidTotal.toFixed(2)}

</div>

<hr
style="
border:none;
border-top:1px solid #eee;
margin:4px 0;
">

<div>

<strong>
Total Winning Amount
</strong>

₹ ${winTotal.toFixed(2)}

</div>

</div>

</td>

</tr>

`;

});


document.getElementById(
"recordInfo"
).innerHTML =

"Showing 1 to " +
filtered.length +
" of " +
filtered.length +
" entries";


calculateSummary();

}


// ==============================================
// TOGGLE DETAIL
// ==============================================

function toggleMarket(rowId,buttonId){

let row =
document.getElementById(
rowId
);

let button =
document.getElementById(
buttonId
);


if(
row.style.display==="table-row"
){

row.style.display="none";

button.innerHTML="+";

button.classList.remove(
"minus"
);

}

else{

row.style.display="table-row";

button.innerHTML="−";

button.classList.add(
"minus"
);

}

}


// ==============================================
// APPLY DATE FILTER
// ==============================================

function applyFilter(){

selectedFromDate =
document.getElementById(
"fromDate"
).value;

selectedToDate =
document.getElementById(
"toDate"
).value;


if(
selectedFromDate &&
selectedToDate &&
selectedFromDate > selectedToDate
){

alert(
"From Date To Date se badi nahi ho sakti"
);

return;

}


renderTable();

}


// ==============================================
// COPY DATA
// ==============================================

function copyTable(){

let markets =
getMarkets();

let text =
"Market Wise Bidding / Winning\n\n";


markets.forEach(function(item,index){

let marketName =
item.market ||
item.name ||
item.marketName ||
"Unknown Market";


let bid =
getMarketBidTotal(
marketName
);


let win =
getMarketWinningTotal(
marketName
);


text +=
(index+1) +
". " +
marketName +
"\n" +
"Total Bid Amount: ₹ " +
bid.toFixed(2) +
"\n" +
"Total Winning Amount: ₹ " +
win.toFixed(2) +
"\n\n";

});


navigator.clipboard
.writeText(text)
.then(function(){

alert(
"Market Wise Data Copied"
);

})
.catch(function(){

alert(
"Copy Not Supported"
);

});

}


// ==============================================
// REFRESH
// ==============================================

function refreshPage(){

renderTable();

}


// ==============================================
// INITIAL DATE
// ==============================================

function setInitialDate(){

let today =
todayISO();

document.getElementById(
"fromDate"
).value =
today;

document.getElementById(
"toDate"
).value =
today;

selectedFromDate =
today;

selectedToDate =
today;

}


// ==============================================
// PAGE LOAD
// ==============================================

setInitialDate();

renderTable();


console.log(
"Market Wise Bidding Winning Final Connected"
);

</script>

</body>

</html>
