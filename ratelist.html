/* =========================================================
   HR MATKA - RATE LIST

/* =========================================================
   1. BASIC RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* =========================================================
   2. PAGE
========================================================= */

}


/* =========================================================
   3. MAIN CONTAINER
========================================================= */

.container{

/* =========================================================
   4. PAGE TITLE
========================================================= */

    padding:18px;
    border-radius:12px;
    font-size:26px;

}


/* =========================================================
   5. RATE FORM CARD
========================================================= */

.rate-box{
    background:#fff;
    padding:18px;
    border-radius:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}


/* =========================================================
   6. SINGLE RATE FIELD
========================================================= */

.rate-row{
    margin-bottom:16px;
}


.rate-row label{
    display:block;
    font-size:16px;
    font-weight:bold;
    margin-bottom:7px;
}


.rate-row input{
    width:100%;
    padding:13px 14px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:17px;
    outline:none;
}


.rate-row input:focus{
    border-color:#d9b436;
    box-shadow:0 0 0 2px rgba(217,180,54,.15);
}


/* =========================================================
   7. SAVE BUTTON
========================================================= */

.save-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#28a745;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}


.save-btn:active{
    transform:scale(.99);
}


/* =========================================================
   8. CURRENT RATE PREVIEW BOX
========================================================= */

.preview-box{
    margin-top:20px;
    background:#fff;
    border-radius:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    overflow:hidden;
}


/* =========================================================
   9. PREVIEW TITLE
========================================================= */

.preview-title{
    background:#d9b436;
    color:#111;
    text-align:center;
    padding:14px;
    font-size:18px;
    font-weight:bold;
}


/* =========================================================
   10. PREVIEW ROW
========================================================= */

.preview-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:13px 15px;
    border-bottom:1px solid #eee;
}


.preview-row:last-child{
    border-bottom:none;
}


.preview-name{
    font-weight:bold;
}


.preview-rate{
    color:#28a745;
    font-weight:bold;
}


/* =========================================================
   11. BACK BUTTON
========================================================= */

.back-btn{
    display:block;
    width:100%;
    margin-top:18px;
    padding:13px;
    text-align:center;
    text-decoration:none;
    background:#0d6efd;
    color:#fff;
    border-radius:9px;
    font-weight:bold;
}


/* =========================================================
   12. MOBILE RESPONSIVE
========================================================= */

@media(max-width:600px){

    .container{
        padding:10px;
    }


    .page-title{
        font-size:22px;
        padding:15px;
    }


    .rate-box{
        padding:15px;
    }


    .rate-row label{
        font-size:15px;
    }


    .rate-row input{
        font-size:16px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     ADMIN LOGIN PROTECTION

     IMPORTANT:
     Ye wahi exact sessionStorage system use karta hai
     jo adminlogin.html aur baaki protected admin pages use karte hain.

     Valid session:
     Rate List normally open hogi.

     Missing / Expired session:
     adminlogin.html par redirect hoga.
========================================================= -->

<script>

(function(){

    "use strict";


    const SESSION_KEY =
    "hrAdminSession";


    const LOGIN_PAGE =
    "adminlogin.html";


    try{

        const raw =
        sessionStorage.getItem(
            SESSION_KEY
        );


        const session =
        raw
        ?
        JSON.parse(raw)
        :
        null;


        const now =
        Date.now();


        if(
            !session
            ||
            session.loggedIn !== true
            ||
            !session.expiresAt
            ||
            now >= Number(session.expiresAt)
        ){

            sessionStorage.removeItem(
                SESSION_KEY
            );


            window.location.replace(
                LOGIN_PAGE
            );


            return;

        }


        console.log(
            "✅ Rate List Admin Login Protection Connected"
        );

    }
    catch(error){

        sessionStorage.removeItem(
            SESSION_KEY
        );


        window.location.replace(
            LOGIN_PAGE
        );

    }

})();

</script>


<!-- =========================================================
     MAIN PAGE
========================================================= -->

<div class="container">


    <!-- =====================================================

<script>

"use strict";


/* =========================================================
   1. SAFE RATE STORAGE READ
========================================================= */

function getSavedRates(){

    try{

        const raw =
        localStorage.getItem(
            "gameRates"
        );


        if(!raw){

            return null;

        }


        return JSON.parse(
            raw
        );

    }
    catch(error){

        console.warn(
            "Rate List Storage Read Error:",
            error
        );


        return null;

    }

}


/* =========================================================
   2. SAVE RATE LIST
========================================================= */

function saveRates(){


    const singleRate =
    document
    .getElementById(
        "singleRate"
    )
    .value
    .trim();


    const jodiRate =
    document
    .getElementById(
        "jodiRate"
    )
    .value
    .trim();


    const singlePannaRate =
    document
    .getElementById(
        "singlePannaRate"
    )
    .value
    .trim();


    const doublePannaRate =
    document
    .getElementById(
        "doublePannaRate"
    )
    .value
    .trim();


    const triplePannaRate =
    document
    .getElementById(
        "triplePannaRate"
    )
    .value
    .trim();


    const halfSangamRate =
    document
    .getElementById(
        "halfSangamRate"
    )
    .value
    .trim();


    const fullSangamRate =
    document
    .getElementById(
        "fullSangamRate"
    )
    .value
    .trim();


    /* =====================================================
       VALIDATION
    ===================================================== */

    if(
        singleRate === ""
        ||
        jodiRate === ""
        ||
        singlePannaRate === ""
        ||
        doublePannaRate === ""
        ||
        triplePannaRate === ""
        ||
        halfSangamRate === ""
        ||
        fullSangamRate === ""
    ){

        alert(
            "Please Fill All Rate Fields"
        );


        return;

    }


    /* =====================================================
       CREATE RATE OBJECT
    ===================================================== */

    const rateData = {

        single:
        Number(
            singleRate
        ),

        jodi:
        Number(
            jodiRate
        ),

        singlePanna:
        Number(
            singlePannaRate
        ),

        doublePanna:
        Number(
            doublePannaRate
        ),

        triplePanna:
        Number(
            triplePannaRate
        ),

        halfSangam:
        Number(
            halfSangamRate
        ),

        fullSangam:
        Number(
            fullSangamRate
        ),

        updatedAt:
        new Date()
        .toISOString()

    };


    /* =====================================================
       SAVE IN LOCAL STORAGE
    ===================================================== */

    localStorage.setItem(

        "gameRates",

        JSON.stringify(
            rateData
        )

    );


    alert(
        "Rate List Saved Successfully"
    );


    loadRates();

}


/* =========================================================
   3. LOAD SAVED RATE LIST
========================================================= */

function loadRates(){

    const rates =
    getSavedRates();


    if(!rates){

        return;

    }


    /* =====================================================
       FILL INPUT BOXES
    ===================================================== */

    document
    .getElementById(
        "singleRate"
    )
    .value =
    rates.single || "";


    document
    .getElementById(
        "jodiRate"
    )
    .value =
    rates.jodi || "";


    document
    .getElementById(
        "singlePannaRate"
    )
    .value =
    rates.singlePanna || "";


    document
    .getElementById(
        "doublePannaRate"
    )
    .value =
    rates.doublePanna || "";


    document
    .getElementById(
        "triplePannaRate"
    )
    .value =
    rates.triplePanna || "";


    document
    .getElementById(
        "halfSangamRate"
    )
    .value =
    rates.halfSangam || "";


    document
    .getElementById(
        "fullSangamRate"
    )
    .value =
    rates.fullSangam || "";


    /* =====================================================
       PREVIEW RATE LIST
    ===================================================== */

    document
    .getElementById(
        "showSingle"
    )
    .textContent =
    "1 Rs Ka "
    +
    (rates.single || 0)
    +
    " Rs";


    document
    .getElementById(
        "showJodi"
    )
    .textContent =
    "1 Rs Ka "
    +
    (rates.jodi || 0)
    +
    " Rs";


    document
    .getElementById(
        "showSinglePanna"
    )
    .textContent =
    "1 Rs Ka "
    +
    (rates.singlePanna || 0)
    +
    " Rs";


    document
    .getElementById(
        "showDoublePanna"
    )
    .textContent =
    "1 Rs Ka "
    +
    (rates.doublePanna || 0)
    +
    " Rs";


    document
    .getElementById(
        "showTriplePanna"
    )
    .textContent =
    "1 Rs Ka "
    +
    (rates.triplePanna || 0)
    +
    " Rs";


    document
    .getElementById(
        "showHalfSangam"
    )
    .textContent =
    "1 Rs Ka "
    +
    (rates.halfSangam || 0)
    +
    " Rs";


    document
    .getElementById(
        "showFullSangam"
    )
    .textContent =
    "1 Rs Ka "
    +
    (rates.fullSangam || 0)
    +
    " Rs";

}


/* =========================================================
   4. NUMBER INPUT MOUSE-WHEEL PROTECTION

   Mouse wheel se accidental amount/rate change na ho.
========================================================= */

document.addEventListener(

    "wheel",

    function(){

        const active =
        document.activeElement;


        if(
            active
            &&
            active.type ===
            "number"
        ){

            active.blur();

        }

    },

    {
        passive:true
    }

);


/* =========================================================
   5. FIRST LOAD
========================================================= */

loadRates();


/* =========================================================
   6. CONSOLE READY
========================================================= */

console.log(
    "✅ HR MATKA Rate List Connected"
);


console.log(
    "✅ Rate List Admin Login Protection Connected"
);


console.log(
    "✅ Number Input Mouse-Wheel Protection Connected"
);

</script>
